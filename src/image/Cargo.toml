[package]
authors = ["Alex Morales", "sfw.tools", "sfwtools.com"]
description = "Decode images into raw pixel frames and encode them in common formats."
edition = "2021"
license = "AGPL-3.0"
name = "image"
version = "0.1.3"

[lib]
crate-type = ["cdylib", "rlib"]
# No doctests exist here; without this, rustdoc receives two `--extern image=`
# candidates (this package and the crates.io dependency) and refuses to run.
doctest = false

[dependencies]
# Shared raw-ABI transport layer (packing, pixel frame); compiles into this
# module's artifact like any other dependency.
abi = { path = "../abi" }
# CRC-32 for PNG chunk checksums; already in the tree via the png crate.
crc32fast = "1.5"
# Fast deflate, used for both PNG encode (Compressor) and decode (via the png
# crate's Decompressor). Hand-rolling the PNG container around fdeflate keeps
# flate2/miniz_oxide out of the artifact: png 0.17 declares flate2 as a
# non-optional dep, so any use of png::Encoder would link it.
fdeflate = "0.3"
# Input decoding: PNG (screenshots), JPEG (phone photos), plus GIF, TIFF, and
# WebP so the module reads the common web and office formats, and the
# near-free built-in formats BMP/PNM/HDR/ICO/QOI. TGA is excluded: the image
# crate's format guessing has no TGA magic bytes, so load_from_memory cannot
# auto-detect it. Other formats (avif/exr/dds) stay off to keep the artifact
# small. Encoding does NOT go through this crate's writer: encode_png builds
# the PNG container directly with fdeflate + crc32fast, so the png encoder and
# flate2 stay dead-stripped.
#
# Pinned to exactly 0.25.5: newer 0.25.x pulls moxcms/pxfm (ICC color
# management) unconditionally, costing ~68 KB for transforms we never ask
# for; embedded ICC profiles are ignored, which is fine for QR sources.
image = { version = "=0.25.5", default-features = false, features = ["png", "jpeg", "gif", "tiff", "webp", "bmp", "pnm", "hdr", "ico", "qoi"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
