[package]
authors = ["Alex Morales", "sfw.tools", "sfwtools.com"]
description = "Generate random ASCII strings (passwords) from host-provided entropy."
edition = "2021"
license = "AGPL-3.0"
name = "random"
version = "0.1.1"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Shared raw-ABI transport layer (packing, options blob, string-array frame).
abi = { path = "../abi" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
